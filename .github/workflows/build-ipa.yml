name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swift --version

      - name: Run unit tests
        run: |
          chmod +x scripts/run-tests.sh
          scripts/run-tests.sh

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build-ipa.sh
          scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeNote-unsigned-ipa
          path: build/FreeNote-unsigned.ipa
          if-no-files-found: error

