name: FreeNote
options:
  bundleIdPrefix: com.freenote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
targets:
  FreeNote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FreeNote
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freenote.local
        PRODUCT_NAME: FreeNote
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: FreeNote/Resources/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - package: ZIPFoundation
  FreeNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: FreeNoteTests
    dependencies:
      - target: FreeNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freenote.local.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  FreeNote:
    build:
      targets:
        FreeNote: all
        FreeNoteTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - FreeNoteTests
    run:
      config: Debug
    archive:
      config: Release



